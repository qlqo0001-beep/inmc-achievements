# inmc-achievements 설정
#
# 업적 자체는 이 파일에 적지 않습니다. `/업적 관리` 화면에서 만들고 고치세요 —
# 손으로 적으면 식별자(uid)를 직접 챙겨야 하고, 그걸 잘못 건드리면 기록이 끊깁니다.

# --- 진행도 검사 ---------------------------------------------------------------
#
# 바닐라 통계(블록 파괴·걸음 수·몹 사냥)는 **마인크래프트가 이미 세고 있습니다.**
# 그래서 리스너를 달지 않고 주기적으로 읽습니다. `PlayerMoveEvent` 로 걸음을 세면
# 접속자마다 초당 20번 도는데, 통계를 읽는 것은 사실상 공짜입니다.
#
# 대신 **접속 중에만 갱신됩니다** — 오프라인 플레이어의 통계는 서버가 읽을 수 없습니다.
sweep:
  # 한 바퀴 도는 데 걸리는 시간(틱). 20 = 1초.
  period-ticks: 100

  # 접속자를 몇 틱에 나눠 훑을지. 한 틱에 전부 훑으면 순간 부하가 튑니다.
  shards: 5

  # 진행도를 공유 저장소에 넘기는 주기(틱). core 의 플러시 주기(30초)와 맞춥니다.
  sync-period-ticks: 600

  # 한 틱에 처리할 완료 수.
  #
  # 낮은 이유가 있습니다. 완료 하나가 **기록 확정 쓰기 1 + 지급 효과마다 1** 번의
  # 디스크 쓰기를 합니다. 그리고 통계 업적을 새로 만들면 이미 조건을 채운 사람들이
  # **한꺼번에** 달성합니다(소급). 상한이 없으면 그 순간 서버가 멈춥니다.
  completions-per-tick: 2

# --- 달성 알림 -----------------------------------------------------------------
#
# 마인크래프트 고유의 발전과제 토스트를 씁니다. 지급했다가 두 틱 뒤에 회수해서
# L키 화면에는 남지 않습니다.
#
# 이 기능이 실패해도 **업적은 100% 동작합니다** — 타이틀·소리·공지로 알립니다.
# 끄면 그쪽만 씁니다.
#
# 주의: 업적의 토스트 아이콘·제목을 고치면 **서버를 다시 켜야** 반영됩니다.
#       다른 설정은 `/업적 관리 리로드` 로 즉시 반영됩니다.
advancement-toasts: true

# --- 지역 ----------------------------------------------------------------------
region:
  # 한 월드에 '정밀 검사' 지역이 이보다 많으면 시작할 때 경고합니다.
  #
  # 정밀 지역은 플레이어가 블록을 옮길 때마다 검사합니다. 비밀 장소처럼 5초 표본으로는
  # 놓칠 수 있는 곳에만 켜세요. 설계 전제는 월드당 1~3개입니다.
  precise-warn-at: 32

# --- 업적 랭크 -----------------------------------------------------------------
#
# 업적 점수 합계로 오릅니다. 왼쪽이 필요한 점수입니다.
# 점수는 **저장하지 않고 기록에서 계산합니다** — 그래서 관리자가 단계를 지우면
# 그만큼 줄어듭니다. 그게 옳은 동작입니다.
ranks:
  0: '<gray>견습</gray>'
  50: '<white>숙련</white>'
  200: '<green>전문</green>'
  500: '<aqua>대가</aqua>'
  1000: '<light_purple>전설</light_purple>'
  2000: '<gold>불멸</gold>'

# --- 보상 ----------------------------------------------------------------------
rewards:
  # 인벤토리가 가득 찼을 때 우편함에 보관할 수 있는 최대 칸.
  mailbox-limit: 54

  # 우편함 보관 기한(초). 0 = 무기한.
  mailbox-expire-seconds: 0

  # 인벤토리가 가득 찼을 때 바닥에 떨굴지. 끄면 우편함으로 갑니다.
  drop-when-inventory-full: false

  # core 의 보상 공지. 업적은 **자체 연출로 알리므로 꺼두는 것이 맞습니다** —
  # 켜면 같은 달성이 두 번 공지됩니다.
  broadcast: false

  season-archive-limit: 5
