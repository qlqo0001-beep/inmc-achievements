# ============================================================
#  inmc-achievements — 지역
# ============================================================
# 업적의 '지역 방문' 조건과 발견 조건이 여기 이름을 가리킵니다.
#
# **`/업적 관리 → 지역 관리` 에서 두 지점을 찍어 만드세요.** 손으로 적어도 되지만
# 좌표를 직접 세야 합니다.
#
# ── precise 를 켤 때 ──────────────────────────────────────
# 기본(precise: false)은 **5초 주기 표본 검사**입니다. 리스너를 달지 않아 공짜지만,
# 5초 안에 지나가 버리면 **발견되지 않습니다.** 그게 버그가 아니라 사양입니다.
#
# 비밀 장소처럼 "밟으면 반드시 열려야" 하는 곳만 precise 로 켜세요. 그 지역만
# 플레이어가 블록을 옮길 때마다 검사합니다. 월드당 1~3개를 전제로 만들었고,
# 32개를 넘으면 시작할 때 경고합니다.

regions:

  # 아래는 예시입니다. 좌표가 여러분 서버와 맞지 않으므로 그대로 쓰지 마시고
  # 관리 화면에서 새로 만들거나 좌표를 고치세요.
  비밀샘:
    world: world
    min: [ 100, 60, 100 ]
    max: [ 110, 70, 110 ]
    precise: true
    display: '숨은 샘'
